  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

<body>
  <app-root></app-root>

  <!-- RingCentral Embeddable Integration Script -->
  <script>
    (function () {
      var rcClientId = window.RC_CLIENT_ID || '';
      if (rcClientId) {
        var rcs = document.createElement('script');
        rcs.src =
          'https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/adapter.js?clientId=' +
          rcClientId +
          '&redirectUri=https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/redirect.html';
        var rcs0 = document.getElementsByTagName('script')[0];
        rcs0.parentNode.insertBefore(rcs, rcs0);
      }
    })();
  </script>
</body>

</html>
